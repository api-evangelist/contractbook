      product_type: APP
      certifier: HubSpot (App Certification)
      listings: 1
      example_listing: https://ecosystem.hubspot.com/marketplace/listing/contractbook-automations-554927
      lapsed: false
      lapsed_note: the certified flag is printed on a LIVE public listing card (CERTIFIED filter); HubSpot prints
        no certification date, so the badge reads as current
    signal_note: certified_products = ONE entry per product type (HubSpot Certified App), never per listing; listing
      counts are context
    detected_by: sweep-hubspot-app-marketplace.py
    detected: '2026-10-21'
  status: not-a-workflow
  arazzo: null
