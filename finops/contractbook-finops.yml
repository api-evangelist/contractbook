description: FinOps view of Contractbook spend. Contractbook is a SaaS contract lifecycle management
  subscription billed primarily on seats plus contract volume, with Public API access sold as
  a paid add-on on the Centralize and Accelerate plans (and Custom/enterprise). Cost drivers
  are the plan tier, number of users/seats, annual signed-contract volume, template count, and
  the API add-on itself. There is no per-API-call metered fee documented; API usage is governed
  by fair-usage limits within the subscription.
notes: List prices and API add-on terms are indicative and quote-based; verify on the pricing
  page and with sales. FOCUS mapping below is a best-effort model of a seat-plus-volume SaaS
  subscription, not a reconciled billing export.
