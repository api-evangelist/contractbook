meters:
- name: seats
  description: Licensed users on the subscription plan.
  unit: seats
  aggregation: max
  dimensions:
  - account
  - plan
- name: signed_contracts
  description: Contracts signed per year against the plan allowance.
  unit: contracts
  aggregation: sum
  dimensions:
  - account
  - plan
- name: templates
  description: Templates provisioned, capped by plan tier.
  unit: templates
  aggregation: max
  dimensions:
  - account
  - plan
- name: api_addon
  description: Public API access add-on enabled on the subscription.
  unit: flat
  aggregation: max
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track seats, annual signed-contract volume, and whether the API add-on is enabled
    per account and plan tier.
- name: Allocation
  description: Map seats and contract volume to teams (legal, sales, HR, procurement) using
    Contractbook spaces.
- name: Optimization
  description: Right-size the plan tier to actual signed-contract volume and seat count; only
    add the API add-on where automated contract generation justifies it.
- name: Accountability
  description: Assign an owner for the subscription; review annual renewal against contract-volume
    and API-usage trends.
