info:
  description: "> **Note**\n>\n> Looking for documentation for **Public API v2**? Click [here](https://api.contractbook.com/v2/docs).\n>\n>\n> Please, provide your feedback via `#help-public-api` channel at [Contractbook Friends](https://contractbook-friends.slack.com/join/shared_invite/zt-953ed23n-oboQCnDCZIO4CyBjkF4iAg#/shared-invite/email)\n> Slack or by sending an email at [help-public-api@contractbook.dk](mailto:help-public-api@contractbook.dk).\n\n## Table of Contents\n\n- [Introduction](#introduction)\n- [Migration from Public API v2](#migration-from-public-api-v2)\n- [Authentication](#authentication)\n- [Use cases](#use-cases)\n  - [Scenario 1: Sending multiple contracts for signature](#scenario-1-sending-multiple-contracts-for-signature-based-on-a-single-document-template)\n  - [Scenario 2: Uploading attachments to a document](#scenario-2-uploading-attachments-to-a-document)\n  - [Scenario 3: Deleting a document](#scenario-3-deleting-a-document)\n  - [Scenario 4: Using data fields](#scenario-4-using-data-fields)\n  - [Scenario 5: Downloading the contract as PDF](#scenario-5-downloading-the-contract-as-pdf)\n  - [Scenario 6: Sharing a document with collaborators](#scenario-6-sharing-a-document-with-collaborators)\n  - [Scenario 7: Receiving notifications for document life-cycle events](#scenario-7-receiving-notifications-for-document-life-cycle-events)\n- [Appendix A: Enhancing the /v3/documents](#appendix-a---enhancing-the-v3documents)\n\n\n## Introduction\n\nContractbook turns static contracts into a database for your entire\norganization, unlocking the full value of your data while ensuring transparency\nand a seamless data flow between tools.\n\nOur API allows you to generate pre-filled drafts from any data source, stay\nupdated on contract activity, and quickly export an overview of all contracts\nand drafts.\n\n> Note: Whenever your user needs to access the Contractbook editor, we expect\n> you to redirect their browser to the appropriate page.\n\n<!-- vale Microsoft.HeadingAcronyms = NO -->\n## Migration from Public API v2\n<!-- vale Microsoft.HeadingAcronyms = YES -->\n\nPublic API v3 introduces several breaking changes focused on simplifying the document and template structure.\n\n### Restructured parties and signees\n\nThe most significant change is the restructuring of document parties and signees. In v2, you had two separate but overlapping structures that created data redundancy:\n\n- `visible_parties`: Basic party info (name, address, type, reference, number)\n- `parties`: Signee details with redundant company/personal fields\n\nIn v3, this has been unified and simplified:\n- **v2 `visible_parties`** → **v3 `parties`**: Contains essential party information\n- **v2 `parties`** → **v3 `signees`**: Nested within parties, contains only signee-related information\n\n**Field changes in the restructuring:**\n- `personal_title` (personal party) and `representative_title` (company party) → unified as `title` in signees\n- `company_representative` (company party) → `full_name` in signees\n- **Removed redundant fields**: `company_address`, `company_name`, `company_number`, `personal_number` (already available in the parent party)\n- **Removed internal references**: `user_id`, `profile_id`, `visible_party_id`\n\n**Signee structure** now contains only signee-related information:\n- `email`, `full_name`, `title`,`order`, `signature_verification_methods`\n- `signed_at`, `opened_at`, `rejected_at`, `changes_requested_at`\n\n### Other removed attributes**\n\n**From documents:**\n- `folders` (folders are deprecated in favor of workspaces)\n\n**From templates:**\n- `target_shared_folder` (folders are deprecated in favor of workspaces)\n- Party structure follows the same pattern as documents\n\n### Migration strategy\n\nWhen migrating from v2 to v3:\n\n1. **Update all endpoint URLs** by replacing `/v2/` with `/v3/`\n2. **Restructure party data** in your requests and response handling:\n   - Map `visible_parties` to `parties`\n   - Move signee information from old `parties` to `signees` array within each party\n3. **Remove deprecated fields** from your payloads (company_*, personal_*, representative_* fields)\n4. **Update response parsing** to handle the new nested signee structure\n5. **Test thoroughly** as the party/signee relationship is now more structured\n\n## Authentication\n\nTo use the API, you'll need to get your own API key. For that, log into\nContractbook and navigate to your profile settings. There you can create an API\nkey which is going to be shown only once upon creation.\n\nThere are two environments for API:\n\n* **[staging](https://api-staging.contractbook.com/v3/docs)**: this environment should\n  only be used for testing purposes only. Here's where you'll be spending most of\n  your time when developing new features for your app(s).\n\n  To obtain an account on staging environment, please contact [help-public-api@contractbook.dk](mailto:help-public-api@contractbook.dk)\n  or ping the team on Slack (see detail at the top of this page).\n\n* **[production](https://api.contractbook.com/v3/docs)**: when you're ready to release\n  your feature, you can switch your app(s) from staging environment to production\n  environment.\n\n> Note: If your application consist of multiple self-sufficient services, it's\n> recommended to use separate tokens for different subparts of your system to be\n> able to revoke them in a more granular way.\n\n## Use cases\n\nPublic API v3 offers an unprecedented level of flexibility when creating and managing documents on Contractbook platform. Examples for how to use the API are presented below.\n\n### Scenario 1. Sending multiple contracts for signature, based on a single document template\n\nOftentimes it's useful to prepare a single document to serve as a template, then send multiple copies of that document for signature to different parties. it's possible to implement this scenario by employing Public API v3. Below is a step-by-step guide how to implement this:\n\n1. Using in-browser document editor, prepare a common template putting \"placeholders\" across it, make note of its id; \"placeholders\" are places in the document text that will be substituted with actual values during template->draft creation process,\n\n2. Prepare request data containing values to put in the placeholders and party details,\n\n3. Use `template_id` obtained in step 1 to create a draft by issuing an HTTP request to the API,\n\n    > **Note**\n    >\n    > To better understand the distinction between the draft and template, see \"[The difference between a draft and a template](https://contractbook.freshdesk.com/support/solutions/articles/206000046352-the-difference-between-a-draft-and-a-template)\"\n\n4. Use `document_id` obtained in step 3 to send the draft for signature by issuing an HTTP request to the API, effectively converting draft into contract pending a signature.\n\nBelow is a closer look at these steps:\n\n1. **visit https://app.contractbook.com, find, open and edit the desired template using the in-browser editor**.\n\n    There are a few things to keep in mind while preparing the template:\n\n      * refer to \"[How to create a contract template from scratch](https://contractbook.freshdesk.com/support/solutions/articles/206000046197-how-can-i-create-a-template-from-scratch-)\" for exhaustive tutorial on how to create templates,\n\n      * be sure to turn text that must be customized by employing \"**Data fields**\" functionality (see \"Using data fields\" scenario for more details on using data fields); later, when preparing the payload for an HTTP API call, actual values to be put in place of data fields will have to be set in the `data_fields` list of maps,\n\n      * while technically this step could be done through an API endpoint too, there's currently no API endpoint to create a template.\n\n        This limitation exists mainly due to the contents of template - what you see in the UI when viewing the template, being a Prosemirror-compatible AST, represented in a JSON format. it's considered an implementation detail such that isn't to be relied on. Contractbook is constantly working on evolving the document format, and is unable to provide a guarantee for the format to not change in future.\n\n        However, if you find yourself still in need of setting the contents of template, consider scenario called \"Creating a draft specifying the contents of the document\"\n\n      * if you choose to use the conditions functionality available in the template editor, it will be resolved in the same way in the Public API as it is when using the Contractbook app. If the data field value used in a condition is provided when creating a document from a template, it will be used to resolve the condition. If the value is not present, the condition will be resolved as `false`, and the content that is guarded by the condition will not be included in the created document.\n\n      * after creating the template, make sure to save the template ID from browser's address bar. For the purpose of this example, a template with ID value of <nobr>`1c843255-9203-4e46-9030-cb966b94359b`</nobr> is used,\n\n2. **create draft by sending a `POST` HTTP request to `/v3/templates/:id/create_document` API endpoint** using desired payload. In the request examples below tools called `curl` (to make HTTP requests) and `jq` (to extract the ID of resulting draft by parsing the JSON from the HTTP response) are used:\n\n    * create the first draft from the template and save the value of `document_id` from response:\n\n        ```shell\n        curl https://api-staging.contractbook.com/v3/templates/1c843255-9203-4e46-9030-cb966b94359b/create_document \\\n          --request POST \\\n          --header \"Content-Type: application/json\" \\\n          --oauth2-bearer \"<access_token>\" \\\n          --silent \\\n          --data '{\n            \"document\": {\n              \"data_fields\": [],\n              \"message\": {\n                \"content\": \"Hi, Kenneth! Please review and sign this.\"\n              },\n              \"parties\": [\n                {\n                  \"address\": \"3722 Crestview Terrace, Del Rio, TX 78840\",\n                  \"id\": \"e5300b40-3053-4d0e-a881-182cd3b31a57\",\n                  \"name\": \"Paul C. Caudillo\",\n                  \"number\": \"409-645-2567\",\n                  \"reference\": \"Sender\",\n                  \"signees\": [\n                    {\n                      \"email\": \"paul@example.com\",\n                      \"full_name\": \"Paul C. Caudillo\",\n                      \"id\": \"2da88cc0-3158-4541-af34-bd633591c31a\",\n                      \"order\": 0,\n                      \"title\": \"CEO\"\n                    }\n                  ],\n                  \"type\": \"company\"\n                },\n                {\n                  \"address\": \"664 Campfire Ave. Lemont, IL 60439\",\n                  \"id\": \"7ca7c4f9-56f4-4d4d-b016-d8391b2375a4\",\n                  \"name\": \"Kenneth B. Rojas\",\n                  \"number\": \"412-786-7983\",\n                  \"reference\": \"Recipient\",\n                  \"signees\": [\n                    {\n                      \"email\": \"kenneth@example.com\",\n                      \"full_name\": \"Kenneth B. Rojas\",\n                      \"id\": \"cdf01430-4da0-4768-b3be-c8800f6aba9f\",\n                      \"order\": 1,\n                      \"title\": \"Dr.\"\n                    }\n                  ],\n                  \"type\": \"personal\"\n                }\n              ],\n              \"signing_order_mode\": \"strict\",\n              \"title\": \"Cooperation agreement between X and Y\",\n              \"to_be_signed_by\": \"others_only\"\n            }\n          }'\n        ```\n\n    * create the second draft from the template and save the value of `document_id` from response:\n\n        ```shell\n        curl https://api-staging.contractbook.com/v3/templates/1c843255-9203-4e46-9030-cb966b94359b/create_document \\\n          --request POST \\\n          --header \"Content-Type: application/json\" \\\n          --oauth2-bearer \"<access_token>\" \\\n          --silent \\\n          --data '{\n            \"document\": {\n              \"data_fields\": [],\n              \"message\": {\n                \"content\": \"Hi, Kenneth! Please review and sign this.\"\n              },\n              \"parties\": [\n                {\n                  \"address\": \"3722 Crestview Terrace, Del Rio, TX 78840\",\n                  \"id\": \"e5300b40-3053-4d0e-a881-182cd3b31a57\",\n                  \"name\": \"Paul C. Caudillo\",\n                  \"number\": \"409-645-2567\",\n                  \"reference\": \"Sender\",\n                  \"signees\": [\n                    {\n                      \"email\": \"paul@example.com\",\n                      \"full_name\": \"Paul C. Caudillo\",\n                      \"id\": \"2da88cc0-3158-4541-af34-bd633591c31a\",\n                      \"order\": 0,\n                      \"title\": \"CEO\"\n                    }\n                  ],\n                  \"type\": \"company\"\n                },\n                {\n                  \"address\": \"664 Campfire Ave. Lemont, IL 60439\",\n                  \"id\": \"7ca7c4f9-56f4-4d4d-b016-d8391b2375a4\",\n                  \"name\": \"Kenneth B. Rojas\",\n                  \"number\": \"412-786-7983\",\n                  \"reference\": \"Recipient\",\n                  \"signees\": [\n                    {\n                      \"email\": \"kenneth@example.com\",\n                      \"full_name\": \"Kenneth B. Rojas\",\n                      \"id\": \"cdf01430-4da0-4768-b3be-c8800f6aba9f\",\n                      \"order\": 1,\n                      \"title\": \"Dr.\"\n                    }\n                  ],\n                  \"type\": \"personal\"\n                }\n              ],\n              \"signing_order_mode\": \"strict\",\n              \"title\": \"Cooperation agreement between X and Y\",\n              \"to_be_signed_by\": \"others_only\"\n            }\n          }'\n        ```\n\n    * please note that it is possible to set the allowed signature verification methods for each signee. This can be done by specifying them in `signature_verification_methods` field, as defined in the `DocumentCreateRequest` schema.\n\n    > **Note**\n    >\n    > It worth mentioning, that at this point it's possible to open the drafts in UI, and perform a review or edit the draft contents. This may be useful in document workflow scenarios that depend on manual approval of documents to be sent for signature.\n    >\n    > This \"pause\" in the flow could also be used to upload file attachments to the draft, either from UI or via API, such that have to differ from attachments in the original templates, if any.\n\n3. the response contains two drafts with IDs `bd272a06-6ee3-4d49-9e73-f7a129b5c673` and `f6ee8b19-cfda-44eb-acf5-b53d28871ea5` respectively. Now, turn each draft into contract pending a signature by sending a `POST` HTTP request to `/v3/documents/:id/send` API endpoint:\n\n    * send the first contract:\n\n        ```shell\n        curl https://api-staging.contractbook.com/v3/documents/bd272a06-6ee3-4d49-9e73-f7a129b5c673/send \\\n          --request POST \\\n          --oauth2-bearer \"<access_token>\" \\\n          --header \"Content-Type: application/json\" \\\n          --silent\n        ```\n\n    * send the second contract:\n\n        ```shell\n        curl https://api-staging.contractbook.com/v3/documents/f6ee8b19-cfda-44eb-acf5-b53d28871ea5/send \\\n          --request POST \\\n          --oauth2-bearer \"<access_token>\" \\\n          --header \"Content-Type: application/json\" \\\n          --silent\n        ```\n\nAt this point depending on the draft signature order settings, one or more recipients will receive an email informing them of a new document pending their signature.\n\nA few things to keep in mind:\n\n* typically, the signee receives an email with link to signing the document. It's possible to expose the link to sign the document in the response of the `POST /v3/documents/:id/send` HTTP API request.\n\n   Exposing the signing link, however requires an additional agreement to be signed between Contractbook and the party who's willing to integrate. The agreement states that integrator takes responsibility for handling this signing link and verifying that the user has provided an email address they have access to.\n\n   After the agreement is signed, the API key used by integrator will be granted special permission, which will expose the signing link located at `.contract.parties[].preview_url` in the HTTP response.\n\n* when the contract contains multiple parties, by default parties will sign the contract in what's known as a \"strict\" order: in an order they're displayed when viewing the contract from the UI.\n\n   In cases when strict order of signing isn't necessary, it may be desirable, for example to shorten the time before the document is fully signed, to send it to all parties for signature, at once. This way parties will sign the contract in a non-determined order.\n\n   The order can be changed during the `POST /v3/documents/:id/send` HTTP API request, via an option called `signing_order_mode`. This option takes one of three values:\n\n   * `random` signing order (also known as signing out of order) means all signees will receive the contract for signing at the same time and there is no order of signing imposed\n   * `strict` signing order means only the first signee will gain access to the contract and only once they sign the second signee will receive access to the contract and once the second signee signs the next signee gains access until all signed.\n   * `grouped` signing order is a mix of the previous two modes. Signees will be grouped and these groups will have a signing order. However, within the same group, signees can sign in a non-determined order.\n\n* it is possible to redirect the signee to a custom URL once the contract has been signed. However, in order to do so, you will need to contact the Contractbook support team. Currently, it is not possible to set the `redirect_url` parameter via the Public API. This setting applies to the API key that is used for Public API requests. Once the setting has been applied, all contracts created with that API key will have the specified redirect behavior after being signed.\n\n### Scenario 2. Uploading attachments to a document\n\nAlong with the document itself, it's oftentimes useful to bundle some files to be signed with document as a single package. For example, the text of the document may refer to some other media, such as images or PDF files, that must be taking into account during the signature process. In the context of document such uploads are called \"attachments.\" Public API v3 offers a way to upload files, attaching them to the document to be signed and thus allowing for scenarios like this.\n\nNote, that documents to which file scan be attached, include:\n\n- a draft created in UI,\n- a draft created using API,\n- a draft created from template using API.\n\nThere's virtually no difference between drafts created from UI and by employing API.\n\nBelow is a step-by-step guide how to attach two files to a document.\n\n1. upload file (or files) by sending a `POST` HTTP request to `/v3/upload` API endpoint containing the file. After a successful upload, store the response:\n\n\n    *\n        ```shell title=\"Request example 1\"\n        curl https://api-staging.contractbook.com/v3/upload \\\n          --request POST \\\n          --oauth2-bearer \"<access_token>\" \\\n          --silent \\\n          --form \"file=/tmp/rfc1149.txt.pdf\"\n        ```\n\n        ```json title=\"Response example 1\"\n        {\n          \"original\": \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/7305c1f5-e494-4427-bce9-6485d445932b/rfc1149.txt.pdf?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135916Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n          \"preview\": [\n            \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/7305c1f5-e494-4427-bce9-6485d445932b/preview/preview-001.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135917Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n            \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/7305c1f5-e494-4427-bce9-6485d445932b/preview/preview-002.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135917Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\"\n          ]\n        }\n        ```\n\n    *\n        ```shell title=\"Request example 2\"\n        curl https://api-staging.contractbook.com/v3/upload \\\n          --request POST \\\n          --oauth2-bearer \"<access_token>\" \\\n          --silent \\\n          --form \"file=/tmp/rfc2346.txt.pdf\"\n        ```\n\n        ```json title=\"Response example 2\"\n        {\n          \"original\": \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/rfc2346.txt.pdf?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135917Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n          \"preview\": [\n            \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/preview/preview-001.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135918Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n            \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/preview/preview-002.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135918Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n            \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/preview/preview-003.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135918Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n            \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/preview/preview-004.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135918Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n            \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/preview/preview-005.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135918Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n            \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/preview/preview-006.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135918Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\"\n          ]\n        }\n        ```\n\n    > **Note**\n    >\n    > While preview addresses could be copied and shared, they're not protected by additional authentication mechanisms. It's up to integrator to take care and not expose these URLs to undesirable viewers. At the same time, because part of preview addresses is a UUID string, guessing it by undesirable viewers is virtually impossible.\n\n2. having an ID of existing draft (for the purpose of this example, an ID with a value of <nobr>`bf1c3b9e-2786-4efb-b0b1-1860d935431b`</nobr> is used), update it by setting `attachments` field:\n\n    ```shell\n    curl https://api-staging.contractbook.com/v3/documents/bf1c3b9e-2786-4efb-b0b1-1860d935431b \\\n      --request PATCH \\\n      --header \"Content-Type: application/json\" \\\n      --oauth2-bearer \"<access_token>\" \\\n      --silent \\\n      --data '{\n        \"document\": {\n          \"version\": \"74129abd-36c0-4dac-9d55-4f5be15e226e\",\n          \"attachments\": [\n            {\n              \"original\": \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/7305c1f5-e494-4427-bce9-6485d445932b/rfc1149.txt.pdf?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135916Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n              \"preview\": [\n                \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/7305c1f5-e494-4427-bce9-6485d445932b/preview/preview-001.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135917Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n                \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/7305c1f5-e494-4427-bce9-6485d445932b/preview/preview-002.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135917Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\"\n              ]\n            },\n            {\n              \"original\": \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/rfc2346.txt.pdf?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135917Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n              \"preview\": [\n                \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/preview/preview-001.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135918Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n                \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/preview/preview-002.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135918Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n                \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/preview/preview-003.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135918Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n                \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/preview/preview-004.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135918Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n                \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/preview/preview-005.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135918Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\",\n                \"http://localhost:4443/contractbook-user-uploads-dev/uploads/128d1081-0cb2-4567-ad05-ee5d4b5e3c0e/attachments/967261eb-c5a0-4ae2-8d00-5d80b0961a1b/preview/preview-006.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=file-service-mock%40contractbook-staging.iam.gserviceaccount.com%2F20250922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20250922T135918Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-\"\n              ]\n            }\n          ]\n        }\n      }'\n    ```\n\n    > **Note**\n    >\n    > A few things to keep in mind:\n    >\n    >   * this will overwrite any existing value of `attachments` attribute on the draft. If you wish to preserve existing values, make sure to fetch the draft and save the value of `attachments`, then combine a list of existing and new attachments before calling the API HTTP endpoint to update the draft,\n    >   * current limit on the uploaded file size is 48 megabytes\n\n### Scenario 3. Deleting a document\n\nSometimes a document has no use anymore and as such it can be desirable to delete such document. Public API v3 offers an endpoint to do just that.\n\nKnowing an ID of existing document (for the purpose of this example, a draft with ID value of <nobr>`370104af-57de-4699-8998-a81d533540ce`</nobr> is used), delete it by sending a `DELETE` request to `/v3/documents/:id` HTTP API endpoint:\n\n```shell title=\"Request example\"\ncurl https://api-staging.contractbook.com/v3/documents/370104af-57de-4699-8998-a81d533540ce \\\n  --request DELETE \\\n  --oauth2-bearer \"<access_token>\" \\\n  --header \"Content-Type: application/json\" \\\n  --silent\n```\n\n> **Note**\n>\n> Signed contract can't be deleted through the API. An attempt to do so will result in a error. To delete a signed contract, it's required to submit respective request through the UI. Such requests are reviewed by Contractbook team. More information about deleting signed contracts is available at [\"How to delete a signed contract?\"](https://contractbook.freshdesk.com/support/solutions/articles/206000046288-how-to-delete-a-signed-contract-)\n\n### Scenario 4. Using data fields\n\nData fields (formerly __editable fields__) are placeholders for values that can be filled in at different stages of the template and document lifecycle. Public API v3 allows for adding, updating, and removing them.\n\nData fields are stored in the `data_fields` list. It's a field present in template and document schemas. If making changes to data fields isn't intended, the content of this field shouldn't be touched.\n\nA data field might be present in the document body, but it doesn't have to. If it's not present in the document body, it's often referred to as __metadata__.\n\n#### Adding a data field\n\nTo add a data field to a template or document, add it to the `data_fields` list. Check the `data_fields` schema to see which properties are required.\nIf you are creating a document from a template and want to reuse the data fields from the template, it's enough to send matching `name` and `type` properties to use the existing data fields.\n\n```shell title=\"Request example\"\ncurl https://api-staging.contractbook.com/v3/documents/9f414a75-8ca4-4743-acae-d55fcb1fe228 \\\n  --request PATCH \\\n  --header \"Content-Type: application/json\" \\\n  --oauth2-bearer \"<access_token>\" \\\n  --silent \\\n  --data '{\n    \"document\": {\n      \"version\": \"84097321-d412-4bd2-bdf0-0c454c0fbf8c\",\n      \"data_fields\": [\n        {\n          \"name\": \"compensation\",\n          \"type\": \"number\",\n          \"value\": \"80000\"\n        },\n        {\n          \"name\": \"length\",\n          \"type\": \"number\",\n          \"value\": \"24\"\n        }\n      ]\n    }\n  }'\n```\n\nThe response looks like this (including only a list of data fields, for brevity):\n\n```shell title=\"Response example\"\n[\n  {\n    \"config\": {},\n    \"description\": null,\n    \"formatting\": null,\n    \"id\": \"d927a003-f63a-4e89-bc09-b98357337121\",\n    \"name\": \"compensation\",\n    \"required\": false,\n    \"source\": null,\n    \"source_mapping\": null,\n    \"source_sync_type\": null,\n    \"type\": \"number\",\n    \"value\": \"80000\"\n  },\n  {\n    \"config\": {},\n    \"description\": null,\n    \"formatting\": null,\n    \"id\": \"3ba3c610-1e8d-4d24-937c-116d197d1b67\",\n    \"name\": \"length\",\n    \"required\": false,\n    \"source\": null,\n    \"source_mapping\": null,\n    \"source_sync_type\": null,\n    \"type\": \"number\",\n    \"value\": \"24\"\n  }\n]\n```\n\n#### Updating the value of a data field\n\nUpdating of data fields works by replacing entire set of data fields on a document. It means that in case a document has many data fields, while only a single one must be updated - a request must contain all document data fields, including the one to be updated.\n\nUsing data fields from previous example's response, it's possible to add a new data field, as well as modify a value of existing data field by sending a `PATCH` request to `/v3/documents` HTTP API endpoint:\n\n```shell title=\"Request example\"\ncurl https://api-staging.contractbook.com/v3/documents/9f414a75-8ca4-4743-acae-d55fcb1fe228 \\\n  --request PATCH \\\n  --header \"Content-Type: application/json\" \\\n  --oauth2-bearer \"<access_token>\" \\\n  --silent \\\n  --data '{\n    \"document\": {\n      \"version\": \"0385e218-33ad-46d2-9ef7-2c01963b8b85\",\n      \"data_fields\": [\n        {\n          \"name\": \"compensation\",\n          \"type\": \"number\",\n          \"value\": \"86000\"\n        },\n        {\n          \"name\": \"length\",\n          \"type\": \"number\",\n          \"value\": \"24\"\n        },\n        {\n          \"name\": \"age\",\n          \"type\": \"number\",\n          \"value\": \"27\"\n        }\n      ]\n    }\n  }'\n```\n\n#### Removing a data field\n\nTo remove a data field, it must be removed from the list of `data_fields` when making a request. It's important to keep in mind, that the data field reference in document's AST will remain.\n\nUsing data fields from previous example's response, two data fields from the draft can be removed by sending a `PATCH` request to `/v3/documents` HTTP API endpoint:\n\n```shell title=\"Request example\"\ncurl https://api-staging.contractbook.com/v3/documents/9f414a75-8ca4-4743-acae-d55fcb1fe228 \\\n  --request PATCH \\\n  --header \"Content-Type: application/json\" \\\n  --oauth2-bearer \"<access_token>\" \\\n  --silent \\\n  --data '{\n    \"document\": {\n      \"version\": \"dfc0270e-10ac-41d8-a917-7fcccf86dbfa\",\n      \"data_fields\": [\n        {\n          \"name\": \"compensation\",\n          \"type\": \"number\",\n          \"value\": \"80000\"\n        }\n      ]\n    }\n  }'\n```\n\n<!-- vale Microsoft.HeadingAcronyms = NO -->\n### Scenario 5. Downloading the contract as PDF\n<!-- vale Microsoft.HeadingAcronyms = YES -->\n\nContractbook discourages printing the contracts, while offering a variety of tools for sharing & viewing the documents. It will also store all documents virtually forever too. However, in rare cases it may be necessary to download a document in a form of PDF file. This can be achieved by employing a dedicated endpoint offered by Public API.\n\nKnowing an ID of existing document (for the purpose of this example, an ID with a value of <nobr>`1f99b233-f660-4ecf-9cf1-9ba6ef299b9d`</nobr> is used), fetch the link to PDF by sending a `GET` request to `/v3/documents/:id/pdf` HTTP API endpoint and inspect the response:\n\n```shell title=\"Request example\"\ncurl https://api-staging.contractbook.com/v3/documents/1f99b233-f660-4ecf-9cf1-9ba6ef299b9d/pdf \\\n  --request GET \\\n  --oauth2-bearer \"<access_token>\" \\\n  --header \"Content-Type: application/json\" \\\n  --silent\n```\n\nThe response will contain a link to download the actual file, use it to download the file. The response will look like this:\n\n```json title=\"Response example\"\n{\n  \"location\": \"http://localhost:5115/static/msmo3r3gdchqdv13m57sq8k9\"\n}\n```\n\n> **Note**\n> In the event when *all* user's documents must be exported to PDF (such as backing them up, externally), make sure to consult one of the following articles:\n\n<!-- vale Microsoft.FirstPerson = NO -->\n> * [How can I download all contracts at once?](https://contractbook.freshdesk.com/support/solutions/articles/206000046202-how-can-i-download-all-my-contracts-at-once-)\n\n> * [How can I export contract data in a CSV format?](https://contractbook.freshdesk.com/support/solutions/articles/206000046303-can-i-export-my-contract-data-to-csv-)\n<!-- vale Microsoft.FirstPerson = YES -->\n\n### Scenario 6. Sharing a document with collaborators\n\nSome document automation workflows may require sharing the document with collaborators. For example, a document that was created automatically needs to be manually reviewed or updated by a human. Public API v3 offers endpoints that allow for these kinds of scenarios.\n\nSharing of a document requires to set what's known as a `role` for collaborator. Choosing the role is a powerful way to differentiate what different collaborators are capable of doing with the document. Possible roles include:\n\n* manager,\n* editor,\n* filler,\n* reviewer.\n\nExample of how to share and stop sharing the document can be seen below:\n\n1. knowing an ID of existing document (for the purpose of this example, an ID with a value of <nobr>`8fae9d83-b965-4642-a2e3-0a16c01c792e`</nobr> is used) and an email of another person, share the document by sending a POST HTTP request to `/v3/documents/:id/share` API endpoint:\n\n    ```shell title=\"Request example 1\"\n    curl https://api-staging.contractbook.com/v3/documents/8fae9d83-b965-4642-a2e3-0a16c01c792e/share \\\n      --request POST \\\n      --header \"Content-Type: application/json\" \\\n      --oauth2-bearer \"<access_token>\" \\\n      --silent \\\n      --data '{\n        \"message\": \"Please, look through this one\",\n        \"role\": \"reviewer\",\n        \"email\": \"user@example.com\"\n      }'\n    ```\n\n2. to stop sharing document with a collaborator, send a DELETE HTTP request to `/v3/documents/:id/share` API endpoint:\n\n    ```shell title=\"Request example 2\"\n    curl https://api-staging.contractbook.com/v3/documents/8fae9d83-b965-4642-a2e3-0a16c01c792e/share \\\n      --request DELETE \\\n      --header \"Content-Type: application/json\" \\\n      --oauth2-bearer \"<access_token>\" \\\n      --silent \\\n      --data '{\n        \"email\": \"user@example.com\"\n      }'\n    ```\n\n### Scenario 7. Receiving notifications for document life-cycle events\n\nIn certain situations, it may be useful to reactively obtain information about events happening to documents in Contractbook. For example, an action must be performed in response to the document being created, updated or signed. One way to know if the document's state has changed would be to fetch the document and inspect its state. However, another, a more efficient way exists, commonly known as \"webhooks\" mechanism.\n\nContractbook Public API v3 implements this mechanism & allows for scenarios which depend on receiving notifications about document's state change. As soon as document's state changes, Contractbook will send an HTTP request to the desired client's address.\n\n> **Note**\n>\n> An important security consideration must be made before using the webhook endpoint. Currently webhooks are unauthenticated. To add a layer of authentication a query parameter with predefined access token can be added. For example, if your endpoint would be:\n>\n> ```\n> https://example.com/webhook_notifications_from_contractbook\n> ```\n>\n> a notification would be sent to:\n>\n> ```\n> https://example.com/webhook_notifications_from_contractbook?access_token=PREDEFINEDVALUE\n> ```\n\nTo ensure security and proper handling of incoming events it's always recommended that, after receiving a webhook notification, your application makes a GET request to `/documents/:id` HTTP API to confirm current status of the document. There are two reasons for this:\n\n* the webhook is unauthenticated but the call to API is authenticated (using provided API key in `Authorization` header), so verifying the state of the document allows you to detect if the webhook notification you received was spoofed,\n\n* webhooks notifications are based on an asynchronous process with automated delivery retries. Inherently, sometimes they can arrive more than once, or with a delay or out of order. Treating them as a trigger for action and getting the state of the document from API allows you to easier handle those edge cases.\n\n> **Note**:\n>\n> Currently, a list of events includes:\n>\n>   * `contract.created`,\n>   * `contract.signed`,\n>   * `contract.rejected`,\n>   * `contract.changes_requested`,\n>   * `contract.edited`,\n>   * `contract.resent`,\n>   * `contract.sent_for_signature`,\n>   * `draft.created`,\n>   * `draft.sent`,\n>   * `draft.edited`,\n>   * `task.created`,\n>   * `task.updated`,\n>   * `task.deleted`,\n>   * `task.reminder`,\n>   * `task.status.updated`,\n>   * `template.created`,\n\nBelow scenario will perform two actions to documents, then observe the webhook payloads arriving to designated `callback_url`.\n\n<!-- vale Microsoft.FirstPerson = NO -->\n1. while creating the API key, make sure to specify the value of `webhooks_url` attribute, see \"[I want to integrate with a tool that can't be found in-app - what should I do?](https://contractbook.freshdesk.com/support/solutions/articles/206000046109-i-want-to-integrate-with-a-tool-i-cannot-find-in-app-what-should-i-do-)\" article. For the purpose of this example, a value of `https://example.com/webhook_notifications_from_contractbook` is used.\n<!-- vale Microsoft.FirstPerson = YES -->\n\n2. create a draft:\n\n    ```shell title=\"Request example 1\"\n    curl https://api-staging.contractbook.com/v3/templates/93ab78f1-d02e-4837-86db-63bfded4efdf/create_document \\\n      --request POST \\\n      --header \"Content-Type: application/json\" \\\n      --oauth2-bearer \"<access_token>\" \\\n      --silent \\\n      --data '{\n        \"document\": {\n          \"data_fields\": [],\n          \"message\": {\n            \"content\": \"Hi, Kenneth! Please review and sign this.\"\n          },\n          \"parties\": [\n            {\n              \"address\": \"3722 Crestview Terrace, Del Rio, TX 78840\",\n              \"id\": \"e5300b40-3053-4d0e-a881-182cd3b31a57\",\n              \"name\": \"Paul C. Caudillo\",\n              \"number\": \"409-645-2567\",\n              \"reference\": \"Sender\",\n              \"signees\": [\n                {\n                  \"email\": \"paul@example.com\",\n                  \"full_name\": \"Paul C. Caudillo\",\n                  \"id\": \"2da88cc0-3158-4541-af34-bd633591c31a\",\n                  \"order\": 0,\n                  \"title\": \"CEO\"\n                }\n              ],\n              \"type\": \"company\"\n            },\n            {\n              \"address\": \"664 Campfire Ave. Lemont, IL 60439\",\n              \"id\": \"7ca7c4f9-56f4-4d4d-b016-d8391b2375a4\",\n              \"name\": \"Kenneth B. Rojas\",\n              \"number\": \"412-786-7983\",\n              \"reference\": \"Recipient\",\n              \"signees\": [\n                {\n                  \"email\": \"kenneth@example.com\",\n                  \"full_name\": \"Kenneth B. Rojas\",\n                  \"id\": \"cdf01430-4da0-4768-b3be-c8800f6aba9f\",\n                  \"order\": 1,\n                  \"title\": \"Dr.\"\n                }\n              ],\n              \"type\": \"personal\"\n            }\n          ],\n          \"signing_order_mode\": \"strict\",\n          \"title\": \"Cooperation agreement between X and Y\",\n          \"to_be_signed_by\": \"others_only\"\n        }\n      }'\n    ```\n\n3. send the draft for signature,\n\n    ```shell title=\"Request example 2\"\n    curl https://api-staging.contractbook.com/v3/documents/3c5c2258-9885-4652-aeb3-a1aa8f1b5461/send \\\n      --request POST \\\n      --oauth2-bearer \"<access_token>\" \\\n      --header \"Content-Type: application/json\" \\\n      --silent\n    ```\n\n4. wait until the final party signs the contract,\n\n5. expect the following payloads to be sent as a POST request to `https://example.com/webhook_notifications_from_contractbook`:\n\n    ```json title=\"Webhook payload example 1\"\n    {\n      \"draft\": {\n        \"id\": \"3c5c2258-9885-4652-aeb3-a1aa8f1b5461\",\n        \"message\": {\n          \"content\": \"Hi, Kenneth! Please review and sign this.\"\n        },\n        \"title\": \"Cooperation agreement between X and Y\",\n        \"updated_at\": \"2025-09-22T14:00:21.232572Z\"\n      },\n      \"event\": \"draft.created\",\n      \"user\": {\n        \"email\": \"api-scenario-test-1758549620@example.com\",\n        \"id\": \"99b423a0-093a-402f-84de-5318536bebd3\"\n      }\n    }\n    ```\n\n    ```json title=\"Webhook payload example 2\"\n    {\n      \"comment\": null,\n      \"contract\": {\n        \"id\": \"3c5c2258-9885-4652-aeb3-a1aa8f1b5461\",\n        \"message\": {\n          \"content\": \"Hi, Kenneth! Please review and sign this.\"\n        },\n        \"state\": \"pending\",\n        \"title\": \"Cooperation agreement between X and Y\",\n        \"updated_at\": \"2025-09-22T14:00:21.455481Z\"\n      },\n      \"event\": \"contract.created\",\n      \"user\": {\n        \"email\": \"api-scenario-test-1758549620@example.com\",\n        \"id\": \"99b423a0-093a-402f-84de-5318536bebd3\"\n      }\n    }\n    ```\n\n## Appendix A - enhancing the `/v3/documents`\n\n### Overview\n\nThe `/v3/documents` endpoint allows you to retrieve a list of documents from our system. By making a `GET` request to this endpoint, you can access a collection of documents along with additional details. To enhance the information retrieved, you have the option to include more comprehensive data by utilizing the query parameter `full=true`.\n\n### Functionality\n\nWhen you set the `full` parameter to `true`, the following enhancements will be applied to the retrieved documents:\n\n1. **Full Parties Details**: Both company and personal party information associated with each document will be included.\n2. **Data Fields Inclusion**: The document will feature all data fields the requesting user can access.\n"
  title: Contractbook Attachments API
  version: '3.0'
  x-logo:
    altText: Contractbook logo
    backgroundColor: '#FFFFFF'
    url: public/contractbook-logo.svg
servers:
- description: Production server
  url: https://api.contractbook.com/v3/
  variables: {}
- description: Staging server
  url: https://api-staging.contractbook.com/v3/
  variables: {}
security: []
tags:
- name: Attachments
paths:
  /upload:
    post:
      callbacks: {}
      deprecated: false
      description: Uploads an attachment
      operationId: create_attachment
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
        description: Attachment data
        required: false
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
          description: Attachment
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
          description: Unauthorized
      summary: Upload an attachment
      tags:
      - Attachments
components:
  schemas:
    UnauthorizedError:
      additionalProperties: false
      description: Unauthorized
      properties:
        error:
          additionalProperties: false
          properties:
            message:
              description: Error details message
              example: Unauthorized
              type: string
            type:
              description: HTTP error message
              example: unauthorized
              type: string
          readOnly: true
          required:
          - type
          - message
          type: object
      readOnly: true
      required:
      - error
      title: UnauthorizedError
      type: object
    FileUploadResponse:
      additionalProperties: false
      description: Document attachment
      properties:
        original:
          description: URL of the attachment
          example: http://example.com/image.png
          format: uri
          type: string
        preview:
          description: 'If the original is a document, this field will hold an list URL with image

            previews of each page

            '
          items:
            example: http://example.com/image.png
            format: uri
            type: string
          type: array
      required:
      - original
      title: FileUploadResponse
      type: object
    FileUploadRequest:
      additionalProperties: false
      description: Payload with file
      properties:
        file:
          description: '**Accepted MIME types:**

            application/msword,

            application/pdf,

            application/vnd.ms-excel,

            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,

            application/vnd.openxmlformats-officedocument.wordprocessingml.document,

            application/zip,

            image/jpeg,

            image/png,

            text/csv,

            text/plain

            '
          format: binary
          type: string
      required:
      - file
      title: FileUploadRequest
      type: object
    BadRequestError:
      additionalProperties: false
      description: Bad Request
      properties:
        error:
          additionalProperties: false
          properties:
            failures:
              description: List of request errors
              items:
                additionalProperties: false
                description: Error description
                properties:
                  detail:
                    description: Details of the error
                    type: string
                  source:
                    additionalProperties: false
                    properties:
                      pointer:
                        description: Failing field name or reference
                        type: string
                    required:
                    - pointer
                    type: object
                  title:
                    description: Title of the error
                    type: string
                required:
                - title
                - detail
                type: object
              type: array
            message:
              description: Error details message
              example: Bad Request
              type: string
            type:
              description: HTTP error message
              example: bad_request
              type: string
          readOnly: true
          required:
          - type
          - message
          type: object
      readOnly: true
      required:
      - error
      title: BadRequestError
      type: object
  securitySchemes:
    authorization:
      scheme: bearer
      type: http
