name: Contractbook
kind: company
description: Contractbook is a contract lifecycle management (CLM) platform that turns static
  contracts into structured, automatable data. Its Public API v3 (base https://api.contractbook.com/v3,
  Bearer API-key auth) lets teams generate pre-filled contract drafts from any data source,
  send documents for electronic signature, manage templates, organize documents into spaces,
  run automations, upload attachments, and receive webhook notifications on document life-cycle
  events. Contractbook covers the full contract lifecycle - drafting, negotiation, signing,
  storage, and post-signature management - for legal, sales, HR, and procurement teams.
