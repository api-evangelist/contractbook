apis:
- aid: contractbook:contractbook-document-webhooks
  name: Contractbook Document Webhooks
  tags:
  - Webhook
  - Notification
  - Event
  - CLM
  - Contract Lifecycle
  tags_raw:
  - Webhooks
  - Notifications
  - Events
  - CLM
  - Contract Lifecycle
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://api.contractbook.com/v3/docs#section/Use-cases/Scenario-7.-Receiving-notifications-for-document-life-cycle-events
  baseURL: https://api.contractbook.com/v3
  properties:
  - url: https://api.contractbook.com/v3/docs
    type: Documentation
  - url: webhooks/contractbook-webhooks.yml
    type: Webhooks
  description: >-
    Contractbook's document life-cycle notification (webhook) mechanism. When a document is created, updated,
    or signed, Contractbook sends an HTTP request to a client-configured callback URL, letting integrations
    react to contract state changes instead of polling. Webhook payloads are unauthenticated by default;
    an access_token query parameter can be added to the callback URL, and recipients are advised to confirm
    state via an authenticated GET /documents/{id} call. Webhook subscriptions are configured in Contractbook
    rather than through documented CRUD endpoints in the Public API v3 OpenAPI, so this API is honestly
    modeled from the documented notification behavior.
